<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSCO Playground — 14 Drill Topics</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--text:#eef3ff;--muted:#9eabc5;--accent:#8b7cff;--good:#39d98a;--bad:#ff6b81;--line:#2b3856;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(12px);z-index:10}
h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 75px)}
nav{border-right:1px solid var(--line);padding:14px;position:sticky;top:75px;height:calc(100vh - 75px);overflow:auto}
nav button{width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer;margin:2px 0}
nav button:hover,nav button.active{background:var(--panel2);color:var(--text)} nav button.active{outline:1px solid #3b4a6f}
main{padding:22px;max-width:1100px;width:100%;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 7px;font-size:20px}h3{margin:16px 0 8px}p{line-height:1.5}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.chip{background:#0e1628;border:1px solid var(--line);border-radius:10px;padding:12px}
button.action{background:var(--accent);border:0;color:white;padding:9px 13px;border-radius:9px;font-weight:700;cursor:pointer}
button.secondary{background:#202b46;border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:9px;cursor:pointer}
input,select{background:#0c1426;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:8px;text-align:center}th{background:#1a2540}
.kmap{display:grid;grid-template-columns:40px repeat(4,1fr);gap:3px;max-width:500px}.cell{min-height:54px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#10182b;border-radius:5px;cursor:pointer;font-weight:700}.cell.one{background:#274c3e;color:#7ff0b2}.cell.zero{background:#271b2c;color:#ff9aab}.cell.x{background:#403a1e;color:var(--yellow)}.label{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
pre{background:#0a1120;border:1px solid var(--line);padding:12px;border-radius:9px;overflow:auto;color:#dbe4ff}.answer{margin-top:10px;padding:10px;border-radius:9px;background:#0c1726;border-left:3px solid var(--good)}.warn{border-left-color:var(--yellow)}
.step{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.big{font-size:28px;font-weight:800}.pulse{animation:p .3s}@keyframes p{50%{transform:scale(1.03)}}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px}nav button{min-width:max-content}.main{padding:12px}}
</style>
</head>
<body>
<header><h1>🧠 DSCO Playground</h1><p>14 exam-style topics → interact, step, predict, check. Based on your DSCO drill sheet.</p></header>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const topics=[
["home","🏠","How to use"],
["q1","1","K-Map"],
["q2","2","Don't-Care + NAND"],
["q3","3","Full Adder"],
["q4","4","Adder/Subtractor"],
["q5","5","BCD Adder"],
["q6","6","4:1 MUX"],
["q7","7","3:8 Decoder"],
["q8","8","Comparator"],
["q9","9","Priority Encoder"],
["q10","10","JK + T Excitation"],
["q11","11","Sequence Detector"],
["q12","12","MOD-5 Counter"],
["q13","13","D-FF Analysis"],
["q14","14","Ring + Johnson"]
];
const nav=document.querySelector("#nav"),main=document.querySelector("#main");
topics.forEach(([id,n,t])=>{let b=document.createElement("button");b.textContent=n+"  "+t;b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});

function show(id){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
 const f=pages[id]||pages.home; main.innerHTML=f(); window.scrollTo(0,0);
}
const pages={};

pages.home=()=>`
<div class="card"><h2>Playground rules 🎮</h2>
<p>Don't passively read. <b>Predict → click/step → compare → repeat.</b></p>
<div class="grid">
<div class="chip"><b>Combinational</b><br><span class="muted">K-map, MUX, decoder, comparator, adders</span></div>
<div class="chip"><b>Sequential</b><br><span class="muted">Flip-flops, FSMs, counters</span></div>
<div class="chip"><b>Core exam move</b><br><span class="muted">Recognize the question → fire the procedure</span></div>
</div></div>
<div class="card"><h2>⚡ 30-second brain</h2>
<table><tr><th>Topic</th><th>Immediate thought</th></tr>
<tr><td>K-map</td><td>Group → freeze what stays → kill what changes</td></tr>
<tr><td>SOP/POS</td><td>1s / 0s</td></tr>
<tr><td>MUX</td><td>Pair rows → 0 / 1 / C / C′</td></tr>
<tr><td>Decoder</td><td>Minterms → OR</td></tr>
<tr><td>Comparator</td><td>MSB → first difference wins</td></tr>
<tr><td>BCD</td><td>Add → >9? → +0110</td></tr>
<tr><td>T FF</td><td>Change = 1</td></tr>
<tr><td>Design</td><td>States → table → excitation → K-map → circuit</td></tr>
<tr><td>Analysis</td><td>Equations → next state → table → diagram</td></tr>
<tr><td>Ring / Johnson</td><td>n / 2n states</td></tr></table></div>
<div class="card"><h2>🔥 Best drill order</h2><p><b>Q1 → Q5 → Q6 → Q11 → Q12</b></p><p class="muted">These hit the biggest procedural skeletons. Then use the other tabs for rapid recall.</p></div>`;

pages.q1=()=>{let vals=Array(16).fill(0);[0,2,5,7,8,10,13,15].forEach(i=>vals[i]=1);return `
<div class="card"><h2>Q1 — K-Map playground</h2><p>Click cells to toggle 0 → 1 → X. Your job: find groups. Remember: <b>bigger group = fewer variables</b>.</p>
<div id="km" class="kmap">${["","00","01","11","10"].map((x,i)=>`<div class="label">${x}</div>`).join("")}${["00","01","11","10"].flatMap((r,ri)=>["00","01","11","10"].map((c,ci)=>{let m=parseInt(r[0]+r[1]+c[0]+c[1],2);return `<div class="cell ${vals[m]?'one':''}" data-m="${m}" onclick="cycleK(this)">${m}</div>`})).join("")}</div>
<div class="step"><button class="action" onclick="document.querySelectorAll('.cell').forEach(c=>c.classList.remove('pulse'));document.querySelectorAll('.cell.one').forEach(c=>c.classList.add('pulse'))">Highlight 1s</button><button class="secondary" onclick="document.querySelectorAll('.cell').forEach(c=>c.className='cell')">Clear</button></div>
<div class="answer"><b>For this question:</b> SOP = <code>B′D′ + BD</code>. POS = <code>(B+D′)(B′+D)</code>.</div></div>`};

pages.q2=()=>`<div class="card"><h2>Q2 — Don't-care + NAND</h2><p>Think: X = <b>free real estate</b>. Use it only when it enlarges a useful group.</p>
<table><tr><th>Given</th><td>Σm(1,3,7,11,15) + d(0,2,5)</td></tr><tr><th>Simplified SOP</th><td><code>CD + A′B′</code></td></tr></table>
<h3>NAND transformation</h3><pre>CD → N1=(CD)′
A′B′ → N2=(A′B′)′
F = NAND(N1,N2)

A′ = NAND(A,A)
B′ = NAND(B,B)</pre>
<p><b>Memory:</b> SOP → NAND first level → NAND final level.</p></div>`;

pages.q3=()=>`<div class="card"><h2>Q3 — Full Adder: build it live</h2><p>Inputs: x, y, z. Step through the two half-adders.</p><div class="step">
<button class="action" onclick="faStep(1)">1. HA1</button><button class="action" onclick="faStep(2)">2. HA2</button><button class="action" onclick="faStep(3)">3. OR carries</button><button class="secondary" onclick="faStep(0)">Reset</button></div><div id="faout" class="big">Ready</div><div class="answer"><code>S=x⊕y⊕z</code> &nbsp; <code>C=xy+xz+yz</code><br><br><b>Memory:</b> HA + HA + OR.</div></div>`;

pages.q4=()=>`<div class="card"><h2>Q4 — Adder / Subtractor</h2><p>Set A and B, then flip M. Watch what happens to B and Cin.</p><div class="grid"><div><label>A <input id="a4" value="0110" maxlength="4"></label></div><div><label>B <input id="b4" value="0011" maxlength="4"></label></div><div><label>M <select id="m4"><option>0</option><option>1</option></select></label></div></div><div class="step"><button class="action" onclick="calcAS()">Run</button></div><pre id="asout">Press Run.</pre><div class="answer"><b>M=0:</b> B unchanged, Cin=0 → ADD.<br><b>M=1:</b> B complemented, Cin=1 → SUBTRACT.</div></div>`;

pages.q5=()=>`<div class="card"><h2>Q5 — BCD Adder: step machine</h2><p>Try 7 + 8. Do not jump straight to 15. Follow the circuit's logic.</p><div class="step"><button class="action" onclick="bcdStep(1)">1. Binary add</button><button class="action" onclick="bcdStep(2)">2. Check correction</button><button class="action" onclick="bcdStep(3)">3. Add 0110</button><button class="secondary" onclick="bcdStep(0)">Reset</button></div><div id="bcd" class="big">Ready</div><div class="answer"><b>Rule:</b> if <code>K + Z8Z4 + Z8Z2 = 1</code>, add <code>0110</code>.</div></div>`;

pages.q6=()=>`<div class="card"><h2>Q6 — 4:1 MUX playground</h2><p>Function: <code>F(A,B,C)=Σm(1,3,4,6)</code>. A,B are selects. You determine each data input.</p><table><tr><th>AB</th><th>F(C=0)</th><th>F(C=1)</th><th>Data input</th></tr><tr><td>00</td><td>0</td><td>1</td><td><b>C</b></td></tr><tr><td>01</td><td>0</td><td>1</td><td><b>C</b></td></tr><tr><td>10</td><td>1</td><td>0</td><td><b>C′</b></td></tr><tr><td>11</td><td>0</td><td>0</td><td><b>0</b></td></tr></table><h3>Prediction drill</h3><p>For row outputs <b>01</b>, what goes into the MUX?</p><button class="action" onclick="this.nextElementSibling.textContent='C ✓ — because output follows C.'">Check</button><span class="answer"></span></div>`;

pages.q7=()=>`<div class="card"><h2>Q7 — Decoder = minterm machine</h2><p><code>F=Σm(0,2,5,7)</code></p><div class="grid">${[0,2,5,7].map(x=>`<div class="chip">Y${x} <b>ON</b></div>`).join("")}</div><pre>3-to-8 decoder
        ┌─────────┐
A,B,C → │ decoder │
        └─────────┘
Y0 ─┐
Y2 ─┤
Y5 ─┤→ OR → F
Y7 ─┘</pre><div class="answer"><b>Memory:</b> decoder creates minterms; OR the minterms you need.</div></div>`;

pages.q8=()=>`<div class="card"><h2>Q8 — Comparator: first difference wins</h2><p>Compare A=1011 and B=1010.</p><div id="cmp" class="grid">${[3,2,1,0].map(i=>`<div class="chip">Bit ${i}<br>A=${"1011"[3-i]} B=${"1010"[3-i]}<br><b>${"1011"[3-i]==="1010"[3-i]?"Equal":"A wins!"}</b></div>`).join("")}</div><div class="answer">Equality bits: <code>x3x2x1x0 = 1110</code><br><b>A&gt;B = 1</b> because the first differing bit from the left is A0=1, B0=0.</div></div>`;

pages.q9=()=>`<div class="card"><h2>Q9 — Priority Encoder</h2><p>Highest priority: D3. Click inputs and see who wins.</p><div class="grid">${[3,2,1,0].map(i=>`<label class="chip">D${i} <input type="checkbox" id="d${i}" onchange="pe()"></label>`).join("")}</div><div id="peout" class="big">No input</div><div class="answer"><code>Y1=D3+D2</code><br><code>Y0=D3+D1D3′</code><br><code>V=D3+D2+D1+D0</code></div></div>`;

pages.q10=()=>`<div class="card"><h2>Q10 — Flip-flop transition trainer</h2><p>Select present and next state. The playground tells you what input is required.</p><div class="step"><select id="q10a"><option>0</option><option>1</option></select> → <select id="q10b"><option>0</option><option>1</option></select><button class="action" onclick="ff()">Check</button></div><pre id="ffout">Choose a transition.</pre><div class="answer"><b>T:</b> change → 1, same → 0.<br><b>JK:</b> 0→0: J=0; 0→1: J=1; 1→0: K=1; 1→1: K=0. Other input = X.</div></div>`;

pages.q11=()=>`<div class="card"><h2>Q11 — Sequence detector: feel the state machine</h2><p>Target = <b>11</b>. Enter a bit at a time. State remembers whether the previous useful thing was a 1.</p><div class="step"><button class="action" onclick="seq(0)">Input 0</button><button class="action" onclick="seq(1)">Input 1</button><button class="secondary" onclick="seqReset()">Reset</button></div><div class="grid"><div class="chip">Current state<br><span id="seqstate" class="big">S0</span></div><div class="chip">Output<br><span id="seqout" class="big">0</span></div></div><p class="muted">S0 = haven't just seen 1. S1 = just saw 1. S2 = detected 11.</p><div class="answer"><b>Design skeleton:</b> state diagram → state table → JK excitation → K-maps → equations → circuit.</div></div>`;

pages.q12=()=>`<div class="card"><h2>Q12 — MOD-5 counter</h2><p>Step the counter. Then test unused states with the buttons below.</p><div class="big" id="counter">000</div><div class="step"><button class="action" onclick="count5()">Clock ↑</button><button class="secondary" onclick="document.getElementById('counter').textContent='000'">Reset</button></div><div class="step"><button class="secondary" onclick="testUnused('101')">Test 101</button><button class="secondary" onclick="testUnused('110')">Test 110</button><button class="secondary" onclick="testUnused('111')">Test 111</button></div><div id="ctrmsg" class="answer">Equations from the drill: TA=A+BC, TB=C, TC=A′.</div></div>`;

pages.q13=()=>`<div class="card"><h2>Q13 — D-FF analysis</h2><p>Given:</p><pre>DA = A ⊕ B ⊕ x
DB = Ax + Bx′</pre><p>Pick a present state and input, then calculate next state.</p><div class="step"><select id="qa"><option>0</option><option>1</option></select><select id="qb"><option>0</option><option>1</option></select><select id="qx"><option>0</option><option>1</option></select><button class="action" onclick="analysisD()">Evaluate</button></div><pre id="dout">Awaiting input.</pre><div class="answer"><b>D FF shortcut:</b> whatever D is, that is Q⁺.</div></div>`;

pages.q14=()=>`<div class="card"><h2>Q14 — Ring vs Johnson</h2><div class="grid"><div><h3>🔵 Ring</h3><div class="big" id="ring">1000</div><button class="action" onclick="ring()">Clock</button><p class="muted">One 1 circulates → 4 states.</p></div><div><h3>🟣 Johnson</h3><div class="big" id="john">0000</div><button class="action" onclick="john()">Clock</button><p class="muted">Fill with 1s, then empty → 8 states.</p></div></div><div class="answer"><b>Ring:</b> last Q feeds first D.<br><b>Johnson:</b> inverted last Q feeds first D.</div></div>`;

function cycleK(el){el.classList.remove("one","x");if(!el.dataset.v)el.dataset.v="1";else if(el.dataset.v==="1")el.dataset.v="x";else el.dataset.v="0";if(el.dataset.v==="1")el.classList.add("one");if(el.dataset.v==="x")el.classList.add("x")}
let fa=0;function faStep(s){fa=s;document.querySelector("#faout").textContent=s===0?"Ready":s===1?"HA1: S1=x⊕y, C1=xy":s===2?"HA2: S=S1⊕z, C2=S1z":"Final: C=C1+C2, S=x⊕y⊕z"}
function calcAS(){let A=document.querySelector("#a4").value,B=document.querySelector("#b4").value,M=+document.querySelector("#m4").value;let y=B.split("").map(b=>+b^M).join("");let sum=parseInt(A,2)+parseInt(y,2)+M;document.querySelector("#asout").textContent=`A       = ${A}\nB       = ${B}\nM       = ${M}\nB XOR M = ${y}\nCin     = ${M}\nResult  = ${(sum&15).toString(2).padStart(4,"0")}\nCarry   = ${sum>15?1:0}\nOperation = ${M?"A − B":"A + B"}`}
let bs=0;function bcdStep(s){bs=s;document.querySelector("#bcd").textContent=s===0?"Ready":s===1?"0111 + 1000 = 1111":s===2?"1111 > 1001 → correction = YES": "1111 + 0110 = 1 0101 → BCD 0001 0101"}
function pe(){let w=[3,2,1,0].find(i=>document.querySelector("#d"+i).checked);document.querySelector("#peout").textContent=w===undefined?"No input":`D${w} wins → ${w.toString(2).padStart(2,"0")}`}
function ff(){let a=+q10a.value,b=+q10b.value;let jk=a===0?(b===0?"J=0, K=X":"J=1, K=X"):(b===0?"J=X, K=1":"J=X, K=0");document.querySelector("#ffout").textContent=`Transition ${a} → ${b}\nJK: ${jk}\nT: ${a^b}`}
let ss=0;function seqReset(){ss=0;document.querySelector("#seqstate").textContent="S0";document.querySelector("#seqout").textContent="0"}function seq(x){if(ss===0)ss=x?1:0;else if(ss===1)ss=x?2:0;else ss=x?2:0;document.querySelector("#seqstate").textContent="S"+ss;document.querySelector("#seqout").textContent=ss===2?"1":"0"}
let cv=0;function count5(){cv=(cv+1)%5;document.querySelector("#counter").textContent=cv.toString(2).padStart(3,"0")}function testUnused(s){let n={101:"101→011",110:"110→010",111:"111→000"}[s];document.querySelector("#ctrmsg").textContent=`Self-correction: ${n} ✓`}
function analysisD(){let a=+qa.value,b=+qb.value,x=+qx.value;let da=a^b^x,db=(a&x)|(b&(!x));document.querySelector("#dout").textContent=`Present = ${a}${b}, x=${x}\nDA = ${da}\nDB = ${db}\nNext state = ${da}${db}`}
let rv="1000",jv="0000";function ring(){rv=rv.slice(1)+rv[0];document.querySelector("#ring").textContent=rv}function john(){jv=(+jv[3]?"0":"1")+jv.slice(0,3);document.querySelector("#john").textContent=jv}
show("home");
</script>
</body>
</html>
